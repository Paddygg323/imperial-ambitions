name: Check and publish browser game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Verify sprite references
        run: npm run check:assets
      - name: Build game-only publication artifact
        run: npm run build:web -- --release
      - name: Verify publication boundary and local serving
        run: npm run test:delivery
      - name: Publish playable game only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WEB_DEPLOY_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-web.mjs
