<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Army characters · Imperial Ambitions</title><link rel="stylesheet" href="current-military/renderer.css"><link rel="stylesheet" href="military.css"><script type="module" src="military.mjs"></script></head>
<body><header><div><a href="index.html">Sprite library</a><h1>Army characters</h1><p id="build">Loading the current military artwork…</p><a href="artillery.html">Review new artillery upgrade chains →</a></div><button id="export">Export review notes</button></header>
<main><aside class="directory"><label for="search">Find a unit</label><input id="search" type="search" placeholder="Name or category"><nav id="units" aria-label="Army characters"></nav></aside>
<article id="review" aria-label="Selected character"><div class="title-row"><div><p id="category"></p><h2 id="name"></h2></div><span id="position"></span></div>
<div class="art-row"><figure class="portrait"><div id="portrait" class="paint-stage parchment"></div><figcaption>Enlarged artwork <span id="dimensions"></span></figcaption><fieldset class="backgrounds"><legend>Background</legend><button data-background="parchment" aria-pressed="true">Parchment</button><button data-background="grass" aria-pressed="false">Grass</button><button data-background="enamel" aria-pressed="false">Navy</button></fieldset></figure>
<section class="sizes" aria-label="Actual game sizes"><h3>In the game</h3><div class="sample"><div id="roster" class="roster"></div><p>Army portrait</p></div><div class="sample grass"><div class="battle-view miniature"><div class="battle-tile" id="formation"></div></div><p>Battle formation · local zoom</p></div><div class="sample grass"><div class="battle-view miniature overview"><div class="battle-tile" id="overview"></div></div><p>Battle formation · overview</p></div></section></div>
<div class="review-fields"><label>Review<select id="status"><option>Awaiting review</option><option>Keep this design</option><option>Needs changes</option></select></label><label class="note-label">What should change?<textarea id="note" rows="3" placeholder="Silhouette, clothing, weapon, pose, colour or proportions…"></textarea></label></div><p id="saved" role="status">Notes stay in this browser. Reviewing does not change the game.</p>
<footer><button id="previous">← Previous unit</button><a href="current-military/regiments.png" target="_blank">View complete atlas</a><button id="next">Next unit →</button></footer></article></main><p id="error" role="alert" hidden></p></body></html>
